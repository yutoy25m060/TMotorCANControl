[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "TMotorCANControl"
version = "1.2.6"
description = "A package to manage AK series T Motors over CAN"
readme = "README.md"
requires-python = ">=3.9, <3.14"
authors = [
    { name = "Mitry Anderson" },
    { name = "Vamsi Peddinti" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "numpy",
    "NeuroLocoMiddleware",
    "python-can>=4.0.0",
    "pyserial>=3.5",
    "PyYAML",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "ruff>=0.15.1",
    "matplotlib>=3.8.0",
]
# my_ak45/Mujoco/ の sysid 作業用（AK45-36_sysid_作業手順.md フェーズ2〜4）。
# mujoco.sysid モジュールは mujoco 3.5.0 で追加された。my_ak45/Mujoco/requirements.txt に
# ある RL(gymnasium等)/MJX-JAX/PyQt6 等の統合依存は sysid作業には不要なため含めない。
mujoco-sysid = [
    "mujoco[sysid]>=3.5.0",
]

# ▼ これを pyproject.toml の一番下に追記 2026/02/13 ▼

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # エラー(E), 警告(F), import整理(I) を有効化
ignore = ["E501"]         # 1行の文字数制限(E501)は無視する

[tool.ruff.format]
quote-style = "double"    # 文字列はダブルクォート(")に統一

[tool.pytest.ini_options]
pythonpath = ["my_ak45"]
testpaths = ["my_ak45/wire_mechanism/tests"]
