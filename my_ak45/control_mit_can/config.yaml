# TMotorCANControl 開発環境設定ファイル
# AK45-36 モーター制御実験用

# モーター設定（単一モーター用）
# max_temp: 電源投入直後・能動指令なしのIDLE状態でもmosfet_temperatureが65〜75℃まで
# 上昇する現象が確認されており（3台20分観測で頭打ちにならず、根本原因は未特定。
# .ai/logs/2026-08-11_01_mit-can-str-attribute-fix_01.md,
# 2026-08-11_02_temperature-decode-verification_01.md 参照）、旧来の50℃だと通常の
# アイドル状態ですら安全停止してしまっていた。実機ファームウェアの
# l_temp_motor_start=85℃（ディレーティング開始点）より十分低く、かつ観測された
# アイドル時の上昇傾向にも実用上のマージンを持たせた75℃に変更（2026-08-11）。
motor:
  type: "AK45-36"  # モーター型番
  id: 1            # CAN ID
  max_temp: 75     # 最大温度 [℃]

# 複数モーター設定（複数モーター制御時に使用）
motors:
  - name: "motor1"      # モーター識別名
    type: "AK45-36"     # モーター型番
    id: 1               # CAN ID
    max_temp: 75        # 最大温度 [℃]（根拠は上記motor.max_tempのコメント参照）
  - name: "motor2"      # モーター識別名
    type: "AK45-36"     # モーター型番
    id: 2               # CAN ID
    max_temp: 75        # 最大温度 [℃]（根拠は上記motor.max_tempのコメント参照）
  - name: "motor3"      # モーター識別名
    type: "AK45-36"     # モーター型番
    id: 3               # CAN ID
    max_temp: 75        # 最大温度 [℃]（根拠は上記motor.max_tempのコメント参照）
  # 必要に応じて追加

# 制御パラメータ
control:
  # リアルタイム制御（NeuroLocoMiddleware）
  realtime:
    dt: 0.01        # 制御周期 [秒] (100Hz)
    report: true     # パフォーマンスレポート有効
    fade: 0          # フェード時間 [秒]

  # インピーダンス制御
  impedance:
    K: 10.0        # 剛性ゲイン [Nm/rad]
    B: 0.5         # 減衰ゲイン [Nm/(rad/s)]

  # 電流制御
  current:
    Kp: 0.1        # 比例ゲイン
    Ki: 0.01       # 積分ゲイン
    limit: 5.0     # 電流制限 [A]

# ログ設定
logging:
  vars: ["output_angle", "output_velocity", "output_torque", "mosfet_temperature"]  # ログ変数
  rate: 100        # ログレート [Hz]

# 実験パラメータ
experiment:
  # ステップ応答
  step:
    amplitude: 1.57  # 振幅 [rad] (90°)
    duration: 5.0    # 持続時間 [秒]

  # チャープ信号
  chirp:
    start_freq: 0.1  # 開始周波数 [Hz]
    end_freq: 10.0   # 終了周波数 [Hz]
    amplitude: 0.5   # 振幅 [rad]
    duration: 30.0   # 持続時間 [秒]

  # 軌跡追従
  trajectory:
    amplitude: 1.57  # 振幅 [rad] (90°)
    period: 4.0      # 周期 [秒]
    duration: 20.0   # 持続時間 [秒]

  # システム同定用 multi-sine 励振信号（純トルク指令、kp=0/kd=0）
  # 参照: my_ak45/Mujoco/docs_syid/Mujoco_システム識別（SysID_モータ実機MuJoCo）について.md セクション2-3
  sysid_excitation:
    base_freq: 4.0    # 基準周波数 [Hz] (RS02実験のsweet spot再現)
    amplitude: 1.5    # 基準振幅 [Nm]（Kt_actualが暫定値のため、単純比例換算値 3.8-5.6Nm より
                       #                大幅に抑えた初期値。理論最大瞬時トルクは amplitude*1.9=2.85Nm）
    duration: 10.0    # 記録時間 [秒]（参照技術と同じ10秒/10,000サンプル）
    dt: 0.001         # サンプリング周期 [秒] (1kHz。本リポジトリでの実機検証実績なし。
                       #                       ジッタが問題になる場合は 0.002 等に緩めること）
    report: true      # SoftRealtimeLoopのタイミングレポート（初回実機実行時のジッタ確認のため有効）

# CAN 設定
can:
  interface: "can0"  # CAN インターフェース
  bitrate: 1000000   # ビットレート [bps] (1Mbps)

# 安全設定
safety:
  max_position: 3.14    # 最大位置 [rad] (180°)
  # 最大速度 [rad/s]（出力軸側）。公式基本仕様表（無負荷回転速度52rpm@24V、出力軸側）から
  # 逆算した無負荷速度は約5.45 rad/s。以前の10.0はこれの約1.8倍で、通常動作では物理的に
  # 到達不能なため速度監視が実質機能していなかった。無負荷速度に約10%の余裕を持たせた
  # 6.0 rad/s に変更（2026-08-05）。詳細は
  # .ai/logs/2026-08-05_04_official-datasheet-crosscheck_01.md 参照。
  max_velocity: 6.0
  max_torque: 10.0      # 最大トルク [Nm]（公式仕様: 定格8Nm・ピーク24Nm。両者の間で妥当な余裕）
  emergency_stop: true  # 緊急停止有効